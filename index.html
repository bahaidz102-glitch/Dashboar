<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinoBlox Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #5865F2;
            margin-bottom: 20px;
        }
        .status-bar {
            text-align: center;
            margin-bottom: 30px;
            padding: 10px;
            background: #16213e;
            border-radius: 10px;
        }
        .online {
            color: #2ea043;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
        }
        .card {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
            flex: 1;
        }
        .card h3 {
            font-size: 32px;
            color: #5865F2;
        }
        .commands, .servers {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .commands h2, .servers h2 {
            margin-bottom: 20px;
            border-left: 4px solid #5865F2;
            padding-left: 15px;
        }
        .cmd-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .cmd-item {
            background: #0f0f1a;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
        }
        .cmd-admin {
            background: #f03030;
            color: white;
        }
        .server-item {
            background: #0f0f1a;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .badge {
            background: #5865F2;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .error {
            background: rgba(240, 48, 48, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: #f03030;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
        }
        .refresh-btn {
            background: #5865F2;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin-left: 10px;
        }
        @media (max-width: 768px) {
            .server-item {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦖 DinoBlox Dashboard</h1>
        
        <div class="status-bar">
            <span id="botStatus">🟢 Đang kết nối...</span>
            <button class="refresh-btn" onclick="fetchData()">🔄 Refresh</button>
        </div>
        
        <div class="stats">
            <div class="card">
                <p>📊 Servers</p>
                <h3 id="serverCount">--</h3>
            </div>
            <div class="card">
                <p>👥 Users</p>
                <h3 id="userCount">--</h3>
            </div>
            <div class="card">
                <p>⚡ Commands</p>
                <h3 id="cmdCount">--</h3>
            </div>
            <div class="card">
                <p>🏓 Ping</p>
                <h3 id="ping">--ms</h3>
            </div>
        </div>
        
        <div class="commands">
            <h2>📋 Danh sách lệnh</h2>
            <div class="cmd-list" id="cmdList">
                <div class="cmd-item">Đang tải...</div>
            </div>
        </div>
        
        <div class="servers">
            <h2>📊 Danh sách Server</h2>
            <div id="serverList">
                <div class="server-item">Đang tải dữ liệu...</div>
            </div>
        </div>
        
        <div class="footer">
            <p>🦖 DinoBlox Bot | Quản lý Roblox Group</p>
            <p>🔗 Dùng lệnh <span class="badge">/help</span> trong Discord</p>
        </div>
    </div>

    <script>
        // API URL - dùng IP hoặc domain bot-hosting
        const API_URL = 'http://fi8.bot-hosting.net:21935';
        
        async function fetchData() {
            try {
                const response = await fetch(`${API_URL}/api/stats`);
                const data = await response.json();
                
                // Update stats
                document.getElementById('serverCount').innerText = data.servers || 0;
                document.getElementById('userCount').innerText = (data.users || 0).toLocaleString();
                document.getElementById('cmdCount').innerText = data.commands || 0;
                document.getElementById('ping').innerText = (data.ping || 0) + 'ms';
                document.getElementById('botStatus').innerHTML = '🟢 Online - ' + (data.botName || 'DinoBlox');
                
                // Update commands list
                if (data.commandList && data.commandList.length > 0) {
                    const adminCommands = ['init', 'removeinit', 'update-all', 'promote', 'demote', 'setrank', 'rankbinds', 'custombinds', 'groupbinds', 'xpbinds'];
                    const cmdList = document.getElementById('cmdList');
                    cmdList.innerHTML = data.commandList.map(cmd => `
                        <div class="cmd-item ${adminCommands.includes(cmd) ? 'cmd-admin' : ''}">/${cmd}</div>
                    `).join('');
                }
                
                // Update servers list
                if (data.serverList && data.serverList.length > 0) {
                    const serverList = document.getElementById('serverList');
                    serverList.innerHTML = data.serverList.map(s => `
                        <div class="server-item">
                            <span>🏠 ${s.name}</span>
                            <span>👥 ${s.members} thành viên</span>
                            <span class="badge">ID: ${s.id}</span>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('serverList').innerHTML = '<div class="server-item">📭 Chưa có server nào</div>';
                }
            } catch (error) {
                console.error('Lỗi:', error);
                document.getElementById('botStatus').innerHTML = '🔴 Không kết nối được bot';
                document.getElementById('serverList').innerHTML = '<div class="error">⚠️ Không thể kết nối đến bot. Hãy đảm bảo bot đang chạy.</div>';
            }
        }
        
        // Load data lần đầu
        fetchData();
        
        // Tự động refresh mỗi 30 giây
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
